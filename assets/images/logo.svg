<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="#0d0b18" />
  <rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="url(#logoGlow)" stroke-width="2" opacity="0.6" />
  <!-- Gamepad icon -->
  <path d="M30 40 C30 32, 70 32, 70 40 C75 52, 78 68, 70 72 C65 74, 58 66, 50 66 C42 66, 35 74, 30 72 C22 68, 25 52, 30 40 Z" 
        fill="url(#logoGlow)" filter="url(#glow)" opacity="0.9" />
  <!-- D-Pad -->
  <rect x="36" y="46" width="4" height="12" rx="1" fill="#ffffff" />
  <rect x="32" y="50" width="12" height="4" rx="1" fill="#ffffff" />
  <!-- Buttons -->
  <circle cx="62" cy="48" r="2" fill="#ffffff" />
  <circle cx="66" cy="52" r="2" fill="#ffffff" />
  <circle cx="58" cy="52" r="2" fill="#ffffff" />
  <circle cx="62" cy="56" r="2" fill="#ffffff" />
</svg>
